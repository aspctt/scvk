; scvk configuration
; Place this file next to scvk.dll. Lines starting with semicolons are comments.

[Admin]
; Setting this to false stops the game from loading the DLL.
Enabled=true

[scvk]
; scvk always stops the game holding a paused city at 30 frames a second. The
; settings below change the frame rate while the city runs. All of this only
; works on game version 641, and scvk checks that the bytes it is about to
; change hold the values it expects before changing anything.

; Raises SimCity 4's frame rate caps, which are normally 30 at Turtle speed,
; 20 at Rhino and 15 at Cheetah. Valid range is 1 to 255. Values above 255 are
; clamped, because the game stores each cap in a single byte.
;
; 0 (the default) leaves the caps alone.
;
; Leave this at 0 if you already use caspervg's sc4-disable-fps-limits plugin.
; Both do the same job, and running both with different values is confusing.
; scvk will detect that case and decline rather than fight over the bytes.
MaxFPS=0

; Lets MaxFPS go above about 60 while the city runs. The game gives every
; frame at least 15 ms of simulation, which keeps it near 60 frames a second
; whatever the cap; true lowers that to 3 ms. The time comes out of the
; simulation, so the city simulates more slowly, most of all at Cheetah.
;
; false (the default) leaves it alone.
UnlockRunningFPS=false

; How much scvk writes to scvk.log, next to scvk.dll.
; Valid values: trace, debug, info, warn, error, critical, off
;
; info (the default) notes what scvk is doing, such as the graphics card and the
; video mode, and anything that went wrong. debug adds statistics every 300
; frames, the diagnostics used to track down drawing bugs, and a few screenshots
; beside the DLL. trace also lists every call the game makes into scvk while it
; starts. off writes no log.
LogLevel=info

[Benchmark]
; Runs a benchmark instead of a normal session. scvk opens the region and
; city named below, pauses the city, times every frame through a fixed set of
; camera scenes, writes scvk-benchmark.csv next to scvk.dll and quits the
; game. tools/benchmark.ps1 in scvk's source sets this up and compares scvk
; with the game's own DirectX driver.
;
; false (the default) leaves the game alone.
Enabled=false

; Which renderer the benchmark measures: scvk, or DirectX for the game's own
; DirectX 7 driver, with scvk loaded only to run the benchmark. DirectX also
; needs Driver=DirectX in SC4GraphicsOptions.ini.
Renderer=scvk

; The region to open, by the name the region view shows. Empty keeps the
; region the game opens with.
Region=

; The city to open, by the name the region view shows or by its save file's
; name, such as City - Springfield.sc4.
City=

; How long each camera scene is timed, in seconds. Valid range is 1 to 600.
SceneSeconds=20

; Quits the game once the results are written.
QuitWhenDone=true
