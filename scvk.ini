; scvk settings
; This file is optional, and scvk runs fine without it. If you want it, keep it
; next to scvk.dll. Lines starting with a semicolon are comments.

[Admin]
; Set this to false to turn scvk off without removing it. The game reads this
; itself and goes back to its DirectX renderer.
Enabled=true

[scvk]
; The frame rate limit for a running city. The game's own limits are 30 on
; Turtle, 20 on Rhino and 15 on Cheetah, and scvk raises all three to your
; monitor's refresh rate, so most people can leave this alone. To pick your own
; limit, remove the semicolon and set a number up to 255. 0 keeps the game's
; limits. -MaxFPS:<n> or -MaxFPS:off in your launch options does the same and
; wins over this line.
;
; A running city stays near 60 frames a second whatever you set here, since the
; game gives every frame at least 15 ms of simulation. A higher limit can slow
; down a heavy city on Rhino and Cheetah. With sc4-disable-fps-limits installed
; this does nothing, because that plugin's limits stay.
;MaxFPS=0

; Set this to true for a 32-bit depth buffer instead of the 16-bit one DirectX
; uses. Surfaces sitting very close together stop banding, but lights laid
; exactly on a model can leave thin lines after scrolling, since custom content
; is made for 16 bits. -DepthBuffer:32 or -DepthBuffer:16 in your launch options
; does the same and wins over this line.
Use32BitDepth=false

; How much scvk writes to scvk.log, next to scvk.dll. From least to most: off,
; critical, error, warn, info, debug, trace.
;
; info is the default and shows your graphics card, the video mode and anything
; that went wrong. debug adds statistics, drawing diagnostics and a few
; screenshots, and trace also lists every call the game makes into scvk while
; it starts.
LogLevel=info

[Benchmark]
; Runs a benchmark instead of a normal game. scvk opens the region and city
; below, pauses the city, times every frame through the same camera moves,
; writes scvk-benchmark.csv next to scvk.dll and quits. tools/benchmark.ps1 in
; scvk's source sets this up for you and compares scvk with DirectX.
Enabled=false

; What to measure: scvk, or DirectX for the game's own driver. DirectX also
; needs Driver=DirectX in SC4GraphicsOptions.ini.
Renderer=scvk

; The region to open, as the region view names it. Leave it empty for the one
; the game opens with.
Region=

; The city to open, as the region view names it, or its save file, such as
; City - Springfield.sc4.
City=

; How many seconds each camera move is timed, from 1 to 600.
SceneSeconds=20

; Quits the game once the results are written.
QuitWhenDone=true
